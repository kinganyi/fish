[pytest]
# 生产树的 pytest 口径（2026-11-11 补，外部审查 🔴12 / 错题本 E-13 的"读数无单一事实源"）
#
# 为什么需要这个文件：本目录是**生产运行树**，不是纯代码仓——它里面同时有
# 备份（`历史版本/` 2126 文件 / 152 个 .py）、运行时数据（`data/`）、审计
# （`_audit/`）、金标样本（`_golden/`）、研究材料（`research/`）。
# 没有这份配置时，`python -m pytest` 会**递归收进备份里的 227 个测试文件**，
# 直接 `Interrupted: 227 errors during collection` —— 于是"跑全量"这件事
# 每次都要靠人记着加参数，测试数因此在不同时刻出现 1166/1573/1647/1651 等
# 多个互相冲突的值。
#
# 判据：从本目录直接 `python -m pytest` 必须只收**顶层**的 test_*.py。
norecursedirs =
    历史版本
    历史版本*
    .git
    .pytest_cache
    __pycache__
    data
    _audit
    _golden
    research
    tools
    scripts
    node_modules
    .venv
    venv

# 只从当前目录起收（配合上面的排除，确保"从 p0 根跑"就是权威口径）。
testpaths = .

# 有意**不设 addopts**：不改变任何人既有的 `python -m pytest` 默认输出与行为。
# 这份文件只解决一件事——别把备份/数据/审计目录收进来。
